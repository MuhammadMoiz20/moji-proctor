# fly.toml app configuration file generated for moji-proctor-dashboard on 2026-01-30T12:39:22-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'moji-proctor-dashboard'
primary_region = 'iad'

[build]
  [build.args]
    VITE_API_URL = "https://moji-proctor-server.fly.dev"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
